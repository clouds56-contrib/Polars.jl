[package]
name = "c-polars"
version = "0.1.0"
edition = "2021"

[lib]
name = "polars"
crate-type = ["cdylib"]

[build-dependencies]
cbindgen = "0.25.0"

[dependencies.polars-core]
version = "0.45.0"

[dependencies.polars]
version = "0.45.0"
features = [
  "parquet",
  "lazy",
  "performant",
  "round_series", # Expr::floor, Expr::ceil
  "abs", # Expr::abs
  "trigonometry", # Expr::sin, Expr::cos, Expr::tan, etc.
  "strings", # StringNameSpace
  "regex", # StringNameSpace::contains_literal
  "is_in", # ListNameSpace::contains
]
