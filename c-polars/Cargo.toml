[package]
name = "c-polars"
version = "0.1.0"
edition = "2021"

[lib]
name = "polars"
crate-type = ["cdylib"]

[build-dependencies]
cbindgen = "0.25.0"

[dependencies]
paste = "1.0.15"

[dependencies.jlrs]
version = "0.21.1"
features = ["jlrs-derive", "ccall"]

[dependencies.polars-core]
version = "0.45.0"

[dependencies.polars]
version = "0.45.0"
features = [
  "parquet",
  "lazy",
  "performant",
  "round_series", # Expr::floor, Expr::ceil
  "abs", # Expr::abs
  "trigonometry", # Expr::sin, Expr::cos, Expr::tan, etc.
  "strings", # StringNameSpace
  "regex", # StringNameSpace::contains_literal
  "is_in", # ListNameSpace::contains
]

[features]
default = ["julia-1-11"]
"julia-1-6" = ["jlrs/julia-1-6"]
"julia-1-7" = ["jlrs/julia-1-7"]
"julia-1-8" = ["jlrs/julia-1-8"]
"julia-1-9" = ["jlrs/julia-1-9"]
"julia-1-10" = ["jlrs/julia-1-10"]
"julia-1-11" = ["jlrs/julia-1-11"]
"julia-1-12" = ["jlrs/julia-1-12"]
"nightly" = ["polars/nightly"]
